[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grc-autoarrange"
version = "0.1.0"
description = "Automatic Block Layout for GNU Radio Companion using Eclipse Layout Kernel (ELK)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-2.0-or-later" }
authors = [
    { name = "GNU Radio Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "pyyaml>=5.0",
]

[project.scripts]
grc-autoarrange = "grc_autoarrange.cli:main"

[tool.setuptools.packages.find]
include = ["grc_autoarrange*"]

[tool.setuptools.package-data]
grc_autoarrange = ["vendor/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
