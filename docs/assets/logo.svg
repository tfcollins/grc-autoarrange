<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Block 1 Gradient (Source) -->
    <linearGradient id="srcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Block 2 Gradient (Processing / ELK Core) -->
    <linearGradient id="procGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Block 3 Gradient (Sink 1) -->
    <linearGradient id="snk1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Block 4 Gradient (Sink 2) -->
    <linearGradient id="snk2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Icon Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" filter="url(#dropShadow)"/>

  <!-- Subtle Blueprint Grid in Background -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1.5">
    <line x1="80" y1="24" x2="80" y2="488"/>
    <line x1="144" y1="24" x2="144" y2="488"/>
    <line x1="208" y1="24" x2="208" y2="488"/>
    <line x1="272" y1="24" x2="272" y2="488"/>
    <line x1="336" y1="24" x2="336" y2="488"/>
    <line x1="400" y1="24" x2="400" y2="488"/>

    <line x1="24" y1="80" x2="488" y2="80"/>
    <line x1="24" y1="144" x2="488" y2="144"/>
    <line x1="24" y1="208" x2="488" y2="208"/>
    <line x1="24" y1="272" x2="488" y2="272"/>
    <line x1="24" y1="336" x2="488" y2="336"/>
    <line x1="24" y1="400" x2="488" y2="400"/>
  </g>

  <!-- Auto-Arrange Beam / Alignment Sweep (ELK Lightning Arc) -->
  <path d="M 64 256 Q 256 120 448 256" fill="none" stroke="url(#borderGrad)" stroke-width="3" opacity="0.3" stroke-dasharray="8 8"/>
  <path d="M 64 256 Q 256 392 448 256" fill="none" stroke="url(#borderGrad)" stroke-width="3" opacity="0.3" stroke-dasharray="8 8"/>

  <!-- Clean Signal Wiring (Connecting Blocks) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Glow Path 1 (Source to Proc) -->
    <path d="M 172 256 L 228 256" stroke="#06b6d4" stroke-width="8" opacity="0.4" filter="url(#glow)"/>
    <path d="M 172 256 L 228 256" stroke="#22d3ee" stroke-width="4"/>

    <!-- Glow Path 2 (Proc to Sink 1 - Top Branch) -->
    <path d="M 324 236 C 354 236, 354 180, 376 180" stroke="#10b981" stroke-width="8" opacity="0.4" filter="url(#glow)"/>
    <path d="M 324 236 C 354 236, 354 180, 376 180" stroke="#34d399" stroke-width="4"/>

    <!-- Glow Path 3 (Proc to Sink 2 - Bottom Branch) -->
    <path d="M 324 276 C 354 276, 354 332, 376 332" stroke="#8b5cf6" stroke-width="8" opacity="0.4" filter="url(#glow)"/>
    <path d="M 324 276 C 354 276, 354 332, 376 332" stroke="#a78bfa" stroke-width="4"/>
  </g>

  <!-- Wire Junction Dots -->
  <circle cx="228" cy="256" r="5" fill="#38bdf8" filter="url(#softGlow)"/>
  <circle cx="324" cy="236" r="5" fill="#34d399" filter="url(#softGlow)"/>
  <circle cx="324" cy="276" r="5" fill="#a78bfa" filter="url(#softGlow)"/>

  <!-- Top Config Header Blocks (Variables) -->
  <g filter="url(#dropShadow)">
    <!-- Variable 1 -->
    <rect x="80" y="80" width="104" height="42" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <path d="M 80 88 Q 80 80 88 80 L 176 80 Q 184 80 184 88 L 184 96 L 80 96 Z" fill="#4338ca"/>
    <text x="92" y="93" fill="#ffffff" font-size="9" font-family="system-ui, sans-serif" font-weight="bold">samp_rate</text>
    <text x="92" y="112" fill="#94a3b8" font-size="8" font-family="monospace">2.4 MHz</text>

    <!-- Variable 2 -->
    <rect x="204" y="80" width="104" height="42" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <path d="M 204 88 Q 204 80 212 80 L 300 80 Q 308 80 308 88 L 308 96 L 204 96 Z" fill="#0f766e"/>
    <text x="216" y="93" fill="#ffffff" font-size="9" font-family="system-ui, sans-serif" font-weight="bold">center_freq</text>
    <text x="216" y="112" fill="#94a3b8" font-size="8" font-family="monospace">915 MHz</text>

    <!-- Variable 3 -->
    <rect x="328" y="80" width="104" height="42" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <path d="M 328 88 Q 328 80 336 80 L 424 80 Q 432 80 432 88 L 432 96 L 328 96 Z" fill="#b45309"/>
    <text x="340" y="93" fill="#ffffff" font-size="9" font-family="system-ui, sans-serif" font-weight="bold">gain</text>
    <text x="340" y="112" fill="#94a3b8" font-size="8" font-family="monospace">40 dB</text>
  </g>

  <!-- LAYER 1: Source Block -->
  <g filter="url(#dropShadow)">
    <rect x="76" y="206" width="96" height="100" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="2.5"/>
    <path d="M 76 218 Q 76 206 88 206 L 160 206 Q 172 206 172 218 L 172 234 L 76 234 Z" fill="url(#srcGrad)"/>
    <text x="86" y="226" fill="#ffffff" font-size="10" font-family="system-ui, sans-serif" font-weight="bold">Signal Source</text>
    
    <!-- Sine Wave Graphic inside Source -->
    <path d="M 92 272 Q 104 246 116 272 T 140 272 T 156 272" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>

    <!-- Out Port -->
    <rect x="166" y="248" width="12" height="16" rx="3" fill="#4ade80" stroke="#16a34a" stroke-width="2"/>
  </g>

  <!-- LAYER 2: Processing Core / ELK Alignment Engine Block -->
  <g filter="url(#dropShadow)">
    <rect x="228" y="196" width="96" height="120" rx="12" fill="#0f172a" stroke="#8b5cf6" stroke-width="3"/>
    <path d="M 228 208 Q 228 196 240 196 L 312 196 Q 324 196 324 208 L 324 224 L 228 224 Z" fill="url(#procGrad)"/>
    <text x="242" y="216" fill="#ffffff" font-size="10" font-family="system-ui, sans-serif" font-weight="bold">ELK Layout</text>

    <!-- Layered Alignment Graphic (Tree / DAG Icon) -->
    <circle cx="254" cy="256" r="7" fill="#a78bfa"/>
    <circle cx="298" cy="242" r="7" fill="#38bdf8"/>
    <circle cx="298" cy="270" r="7" fill="#34d399"/>
    <line x1="254" y1="256" x2="298" y2="242" stroke="#c4b5fd" stroke-width="2.5"/>
    <line x1="254" y1="256" x2="298" y2="270" stroke="#c4b5fd" stroke-width="2.5"/>

    <!-- In Port -->
    <rect x="222" y="248" width="12" height="16" rx="3" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
    <!-- Out Port 1 -->
    <rect x="318" y="228" width="12" height="16" rx="3" fill="#4ade80" stroke="#16a34a" stroke-width="2"/>
    <!-- Out Port 2 -->
    <rect x="318" y="268" width="12" height="16" rx="3" fill="#4ade80" stroke="#16a34a" stroke-width="2"/>
  </g>

  <!-- LAYER 3A: Top Sink (Time Sink) -->
  <g filter="url(#dropShadow)">
    <rect x="376" y="140" width="88" height="80" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2.5"/>
    <path d="M 376 152 Q 376 140 388 140 L 452 140 Q 464 140 464 152 L 464 168 L 376 168 Z" fill="url(#snk1Grad)"/>
    <text x="388" y="160" fill="#ffffff" font-size="9.5" font-family="system-ui, sans-serif" font-weight="bold">Time Sink</text>
    
    <!-- Oscilloscope Display Icon -->
    <rect x="390" y="178" width="60" height="32" rx="4" fill="#022c22" stroke="#059669" stroke-width="1.5"/>
    <path d="M 394 194 L 404 186 L 414 202 L 424 188 L 434 198 L 446 194" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>

    <!-- In Port -->
    <rect x="370" y="172" width="12" height="16" rx="3" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
  </g>

  <!-- LAYER 3B: Bottom Sink (Frequency Sink / FFT) -->
  <g filter="url(#dropShadow)">
    <rect x="376" y="292" width="88" height="80" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="2.5"/>
    <path d="M 376 304 Q 376 292 388 292 L 452 292 Q 464 292 464 304 L 464 320 L 376 320 Z" fill="url(#snk2Grad)"/>
    <text x="388" y="312" fill="#ffffff" font-size="9.5" font-family="system-ui, sans-serif" font-weight="bold">Freq Sink</text>

    <!-- FFT Spectrum Bars Icon -->
    <rect x="390" y="330" width="60" height="32" rx="4" fill="#083344" stroke="#0891b2" stroke-width="1.5"/>
    <rect x="396" y="348" width="5" height="10" fill="#22d3ee" rx="1"/>
    <rect x="405" y="342" width="5" height="16" fill="#22d3ee" rx="1"/>
    <rect x="414" y="334" width="5" height="24" fill="#67e8f9" rx="1"/>
    <rect x="423" y="340" width="5" height="18" fill="#22d3ee" rx="1"/>
    <rect x="432" y="346" width="5" height="12" fill="#22d3ee" rx="1"/>
    <rect x="441" y="352" width="5" height="6" fill="#22d3ee" rx="1"/>

    <!-- In Port -->
    <rect x="370" y="324" width="12" height="16" rx="3" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
  </g>

  <!-- Magic Sparkles / Auto-Arrange Indicator Stars -->
  <g fill="#facc15" filter="url(#softGlow)">
    <path d="M 458 64 L 462 76 L 474 80 L 462 84 L 458 96 L 454 84 L 442 80 L 454 76 Z"/>
    <path d="M 64 420 L 67 430 L 477 433 L 67 436 L 64 446 L 61 436 L 51 433 L 61 430 Z" transform="translate(10, -10) scale(0.8)"/>
    <path d="M 430 430 L 433 438 L 441 441 L 433 444 L 430 452 L 427 444 L 419 441 L 427 438 Z" transform="translate(15, -15) scale(0.9)"/>
  </g>

  <!-- Bottom Brand Text (GRC AUTO-ARRANGE) -->
  <g text-anchor="middle">
    <text x="256" y="440" fill="#ffffff" font-size="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" letter-spacing="4">GRC AUTO-ARRANGE</text>
    <text x="256" y="462" fill="#06b6d4" font-size="11" font-family="monospace" font-weight="bold" letter-spacing="2">ECLIPSE LAYOUT KERNEL (ELK)</text>
  </g>
</svg>
